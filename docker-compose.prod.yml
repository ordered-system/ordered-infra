services:
  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env.prod}
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-product:
    image: postgres:16-alpine
    container_name: postgres-product
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_service
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in .env.prod}
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_service -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env.prod}
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env.prod}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env.prod}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.prod}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://grafana.${BASE_DOMAIN:?set BASE_DOMAIN in .env.prod}/"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped

  config-server:
    build:
      context: ../ordered-config-server
    container_name: config-server
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
    restart: unless-stopped

  eureka:
    build:
      context: ../ordered-eureka
    container_name: eureka
    restart: unless-stopped

  gateway:
    build:
      context: ../ordered-gateway
    container_name: gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - config-server
      - eureka
    restart: unless-stopped

  order-service:
    build:
      context: ../ordered-order-service
      additional_contexts:
        commons: ../ordered-commons
    container_name: order-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres-order:5432/order_db
      DB_USERNAME: order_service
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env.prod}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env.prod}
    depends_on:
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: ../ordered-product-service
      additional_contexts:
        commons: ../ordered-commons
    container_name: product-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres-product:5432/product_db
      DB_USERNAME: product_service
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in .env.prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENGAGEMENT_SERVICE_URL: http://engagement-service:9094
    depends_on:
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      postgres-product:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ../ordered-user-service
      additional_contexts:
        commons: ../ordered-commons
    container_name: user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      DB_URL: jdbc:postgresql://postgres-user:5432/user_db
      DB_USERNAME: user_service
      DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env.prod}
    depends_on:
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      postgres-user:
        condition: service_healthy
    restart: unless-stopped

  engagement-service:
    build:
      context: ../ordered-engagement-service
      additional_contexts:
        commons: ../ordered-commons
    container_name: engagement-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env.prod}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env.prod}@mongo:27017/engagement_db?authSource=admin
    depends_on:
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - grafana
      - jaeger
    restart: unless-stopped

volumes:
  postgres_order_data:
  postgres_product_data:
  postgres_user_data:
  mongo_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config: